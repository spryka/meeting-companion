workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

default:
  image: python:3.12-slim
  tags:
    - k8s-general
  interruptible: true
  timeout: 10m

python-tests:
  script:
    - python -m pip install --disable-pip-version-check numpy soundfile
    - python -B -m unittest discover -s transcription -p 'test_*.py' -v

shell-syntax:
  script:
    - |
      for script in scripts/*.sh transcription/*.sh; do
        bash -n "$script" || exit 1
      done
